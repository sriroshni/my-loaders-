<!DOCTYPE html>
<html>
<head>
  <title>Track Shipment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h2>Track Shipment</h2>

  <div class="tracker">

    <!-- Warehouse -->
    <div class="point">
      <div class="icon active">🏭</div>
      <p>Warehouse</p>
    </div>

    <!-- Track -->
    <div class="track">
      <div class="track-fill"></div>
      <div class="truck">🚚</div>
    </div>

    <!-- Destination -->
    <div class="point">
      <div class="icon">🏠</div>
      <p>Destination</p>
    </div>

  </div>

  <p class="status">Shipment is on the way...</p>
</div>

</body>
</html>
